<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>TukarView</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:var(--tg-theme-bg-color,#fff);--tx:var(--tg-theme-text-color,#222);--mut:var(--tg-theme-hint-color,#888);--pri:var(--tg-theme-button-color,#6c5deb);--ptx:var(--tg-theme-button-text-color,#fff);--card:var(--tg-theme-secondary-bg-color,#f2f2f7);--bad:#d45b15}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;padding-bottom:70px}
header{position:sticky;top:0;background:var(--bg);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--card);z-index:5}
.poin{background:var(--pri);color:var(--ptx);padding:4px 12px;border-radius:14px;font-weight:700}
main{padding:14px;max-width:640px;margin:0 auto}
.card{background:var(--card);border-radius:12px;padding:14px;margin-bottom:12px}
h3{margin:0 0 10px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;background:none;color:var(--mut);padding:12px 4px;font-size:13px}
nav button.on{color:var(--pri);font-weight:700}
.btn{background:var(--pri);color:var(--ptx);border:0;border-radius:8px;padding:10px 16px;font-size:14px;width:100%}
.btn.s{width:auto;padding:5px 10px;font-size:12px}.btn.r{background:var(--bad)}
input,select{width:100%;padding:10px;border-radius:8px;border:1px solid var(--mut);background:var(--bg);color:var(--tx);font-size:15px;margin:4px 0 10px}
label{font-size:13px;color:var(--mut)}
.vid{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--bg)}
.mut{color:var(--mut);font-size:12px}
.ov{position:fixed;inset:0;background:var(--bg);z-index:20;padding:14px;overflow:auto}
#yt,#yt iframe{width:100%;aspect-ratio:16/9;background:#000;border-radius:8px}
.bar{height:8px;background:var(--card);border-radius:4px;overflow:hidden;margin:10px 0}.bar i{display:block;height:100%;width:0;background:var(--pri);transition:width .5s}
.big{font-size:42px;font-weight:700;text-align:center;color:var(--pri)}
.tag{padding:2px 8px;border-radius:10px;background:var(--bg);font-size:12px}
.row{display:flex;gap:8px}.row>*{flex:1}
</style>
</head>
<body>
<header><b>▶ TukarView</b><span class="poin" id="poin">0 poin</span></header>
<main id="main"><div class="card">Memuat...</div></main>
<nav id="nav"></nav>
<div id="ov"></div>
<script src="config.js"></script>
<script>
const tg=window.Telegram&&Telegram.WebApp;if(tg){tg.ready();tg.expand()}
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const alertx=m=>tg&&tg.showAlert?tg.showAlert(m):alert(m);
let me=null,tab='tonton',am={q:'',pg:0};
async function api(path,body){
  const h={'Authorization':'tma '+(tg?tg.initData:'')};
  const o={headers:h};
  if(body){o.method='POST';o.body=JSON.stringify(body);h['content-type']='application/json'}
  try{const r=await fetch(CONFIG.API_URL+path,o);return await r.json()}catch(e){return{error:'Koneksi bermasalah.'}}
}
async function init(){
  if(typeof CONFIG==='undefined'||/GANTI/.test(CONFIG.API_URL)){$('#main').innerHTML='<div class="card">Alamat API belum diisi. Buka file config.js dan isi API_URL.</div>';return}
  const r=await api('me');
  if(r.error){$('#main').innerHTML='<div class="card">'+esc(r.error)+'</div>';return}
  me=r;setPoin(r.poin);nav();show('tonton');
}
function setPoin(p){me.poin=p;$('#poin').textContent=p+' poin'}
async function sync(){const m=await api('me');if(!m.error){me.refs=m.refs;setPoin(m.poin)}}
function nav(){
  const t=[['tonton','Tonton'],['boost','Boost'],['saya','Saya']];if(me.admin)t.push(['admin','Admin']);
  $('#nav').innerHTML=t.map(x=>`<button class="${tab===x[0]?'on':''}" onclick="show('${x[0]}')">${x[1]}</button>`).join('');
}
function show(t){tab=t;nav();({tonton,boost,saya,admin})[t]()}
const out=h=>$('#main').innerHTML=h;

async function tonton(){
  out('<div class="card">Memuat...</div>');
  await sync();
  const r=await api('videos');
  out(`<div class="card"><h3>Tonton &amp; kumpulkan poin</h3><div class="mut">Tonton video orang lain: 1 detik = 1 poin, durasinya ditentukan pemilik video. Poin ini bisa Anda jadikan modal tayang untuk video Anda di tab Boost. Video harus diputar penuh.</div></div>
  <div class="card">${(r.videos||[]).map(v=>`<div class="vid"><div>▶ Video ${v.yt_id.slice(0,4)}…<div class="mut">${v.detik} detik</div></div><button class="btn s" onclick="watch(${v.id})">+${v.detik} poin</button></div>`).join('')||'<div class="mut">Belum ada video tersedia. Coba lagi nanti.</div>'}</div>`);
}

/* ---------- Pemutar + heartbeat ---------- */
let player=null,tm=null,ps=-1;
function loadYT(ok,bad){
  if(window.YT&&YT.Player)return ok();
  window.onYouTubeIframeAPIReady=ok;
  const s=document.createElement('script');s.src='https://www.youtube.com/iframe_api';s.onerror=bad;document.head.appendChild(s);
  setTimeout(()=>{if(!(window.YT&&YT.Player))bad()},8000);
}
async function watch(id){
  const r=await api('start',{video_id:id});
  if(r.error)return alertx(r.error);
  let local=0,c=0,busy=false;ps=-1;
  $('#ov').innerHTML=`<div class="ov"><h3>Tonton ${r.detik} detik</h3><div id="yt"></div><div class="bar"><i id="pb"></i></div><div class="big" id="cd">${r.detik}</div><div class="mut" id="st">Memuat pemutar...</div><br><button class="btn r" onclick="closeW()">Batal</button></div>`;
  loadYT(()=>{
    player=new YT.Player('yt',{videoId:r.yt,playerVars:{autoplay:1,rel:0,playsinline:1},events:{onStateChange:e=>ps=e.data,onReady:e=>{const d=e.target.getDuration();if(d>0&&d<r.detik){setS('Video lebih pendek dari durasi wajib.');clearInterval(tm)}}}});
    tm=setInterval(async()=>{
      if(busy)return;
      const vis=document.visibilityState==='visible',pl=ps===1&&vis;
      if(pl)local++;c++;
      setS(pl?'Menonton '+local+'/'+r.detik+' dtk':(!vis?'Aplikasi tidak aktif, hitungan dijeda.':'Tekan play, hitungan hanya jalan saat video diputar.'));
      $('#cd').textContent=Math.max(r.detik-local,0);$('#pb').style.width=Math.min(100,local/r.detik*100)+'%';
      if(c%5===0||local>=r.detik){
        busy=true;await api('hb',{sid:r.sid,playing:pl});
        if(local>=r.detik){
          clearInterval(tm);const f=await api('finish',{sid:r.sid});
          closeW();
          if(f.error){alertx(f.error)}else{setPoin(f.poin);alertx('Valid! +'+f.got+' poin')}
          return tonton();
        }
        busy=false;
      }
    },1000);
  },()=>setS('Pemutar YouTube gagal dimuat. View tidak dihitung.'));
}
const setS=t=>{const e=$('#st');if(e)e.textContent=t};
function closeW(){clearInterval(tm);try{player&&player.destroy()}catch(e){}player=null;$('#ov').innerHTML=''}

/* ---------- Boost ---------- */
async function boost(){
  await sync();
  const r=await api('mine');
  out(`<div class="card"><h3>Pasang video saya</h3>
  <div class="mut">Poin tersedia: <b>${me.poin}</b></div>
  <label>Link YouTube</label><input id="b_url" placeholder="https://youtu.be/...">
  <label>Durasi tonton per penonton</label><select id="b_d" onchange="hit()"><option value="30">30 detik</option><option value="60">60 detik</option><option value="120">120 detik</option><option value="300">300 detik</option></select>
  <label>Jumlah penonton</label><input id="b_m" type="number" value="${Math.max(1,Math.min(Math.floor(me.poin/30),5))}" oninput="hit()">
  <p id="b_e"></p>
  <button class="btn" onclick="doBoost()">Pasang video</button>
  <div class="mut" style="margin-top:8px">Pasang GRATIS. 1 detik = 1 poin. Modal dipindah dari poin Anda ke video ini. Setiap penonton yang menonton penuh mendapat poin sesuai durasi, diambil dari modal video. Modal habis, video berhenti tampil sampai Anda mengisi lagi. Menghentikan video mengembalikan sisa modal ke poin Anda. Aturan adil: modal yang Anda tanam dalam 24 jam tidak boleh lebih besar dari poin yang Anda dapat dari menonton (kecuali belum ada video yang bisa Anda tonton). Video yang tidak ditonton 3 hari dihentikan dan sisa modal dikembalikan. Pilih durasi yang tidak lebih panjang dari video. Anda tidak bisa menonton video sendiri.</div></div>
  <div class="card"><h3>Video saya</h3>${(r.videos||[]).map(v=>`<div class="vid" style="display:block"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><div>${esc(v.yt_id)}<div class="mut">${v.detik} dtk · ${v.dilihat}x ditonton · sisa ${Math.floor(v.sisa/v.detik)} penonton (${v.sisa} poin) <span class="tag">${v.status==='aktif'?(v.sisa<v.detik?'modal habis: isi poin':'aktif'):v.status}</span></div></div>${v.status==='aktif'?`<button class="btn s r" onclick="cancel(${v.id})">Hentikan</button>`:''}</div>${v.status==='aktif'?`<div class="row" style="margin-top:6px"><input id="tp_${v.id}" type="number" placeholder="Tambah penonton" style="margin:0"><button class="btn s" style="flex:0 0 auto" onclick="topup(${v.id})">Tambah</button></div>`:''}</div>`).join('')||'<div class="mut">Belum ada.</div>'}</div>`);
  hit();
}
function hit(){const d=+$('#b_d').value,n=parseInt($('#b_m').value)||0,c=d*n;$('#b_e').innerHTML='Modal yang dipakai: <b>'+c+'</b> poin ('+n+' penonton x '+d+' poin).'+(c>me.poin?' <span style="color:#d45b15">Melebihi poin Anda.</span>':'')}
async function doBoost(){
  const r=await api('boost',{url:$('#b_url').value,detik:$('#b_d').value,views:$('#b_m').value});
  if(r.error)return alertx(r.error);
  setPoin(r.poin);alertx('Video terpasang!');boost();
}
async function cancel(id){const r=await api('cancel',{video_id:id});if(r.error)return alertx(r.error);alertx('Dihentikan. '+r.refund+' poin dikembalikan.');boost()}
async function topup(id){const r=await api('topup',{video_id:id,views:$('#tp_'+id).value});if(r.error)return alertx(r.error);alertx('Penonton ditambah');boost()}
window.boost=boost;

/* ---------- Saya ---------- */
async function saya(){
  await sync();
  const r=await api('mine'),link=`https://t.me/${me.bot}?startapp=ref_${me.tg_id}`;
  out(`<div class="card"><h3>${esc(me.name)}</h3><div>Saldo: <b>${me.poin} poin</b></div><div class="mut">Undangan: ${me.refs} orang</div></div>
  <div class="card"><h3>Ajak teman</h3><div class="mut" style="word-break:break-all">${esc(link)}</div><br><button class="btn" onclick="navigator.clipboard&&navigator.clipboard.writeText('${link}');alertx('Link disalin')">Salin link</button><div class="mut" style="margin-top:6px">Bonus poin saat teman menyelesaikan tontonan pertamanya.</div></div>
  <div class="card"><h3>Riwayat poin</h3>${(r.ledger||[]).map(l=>`<div class="vid"><span>${esc(l.reason)}</span><b style="color:${l.delta>0?'#2e8b57':'#d45b15'}">${l.delta>0?'+':''}${l.delta}</b></div>`).join('')||'<div class="mut">Belum ada.</div>'}</div>`);
}

/* ---------- Admin: daftar member ---------- */
async function admin(){
  out(`<div class="card"><h3>Daftar Member</h3><div id="ast" class="mut"></div><input id="aq" placeholder="Cari nama / username / ID Telegram" value="${esc(am.q)}" oninput="am.q=this.value;am.pg=0;clearTimeout(window.__t);window.__t=setTimeout(loadM,300)"></div><div class="card" id="alist">Memuat...</div>`);
  loadM();
}
async function loadM(){
  const r=await api('admin/members?q='+encodeURIComponent(am.q)+'&page='+am.pg);
  if(r.error){$('#alist').textContent=r.error;return}
  const s=r.stats||{};
  $('#ast').textContent=`Total ${s.total||0} · Diblokir ${s.blokir||0} · Baru 24 jam ${s.hari||0}`;
  $('#alist').innerHTML=r.members.map(m=>`<div class="vid"><div><b>${esc(m.name)}</b> ${m.username?'@'+esc(m.username):''}<div class="mut">ID ${m.tg_id} · ${m.poin} poin · ${m.views} view · ${new Date(m.created_at*1000).toLocaleDateString('id-ID')} <span class="tag">${m.status}</span></div></div><div><button class="btn s" onclick="adjPoin(${m.id})">Poin</button> <button class="btn s ${m.status==='aktif'?'r':''}" onclick="setSt(${m.id},'${m.status==='aktif'?'blokir':'aktif'}')">${m.status==='aktif'?'Blokir':'Aktifkan'}</button></div></div>`).join('')||'<div class="mut">Tidak ada member.</div>'
  +`<div class="row" style="margin-top:10px"><button class="btn s" ${am.pg<=0?'disabled':''} onclick="am.pg--;loadM()">‹</button><button class="btn s" ${r.members.length<15?'disabled':''} onclick="am.pg++;loadM()">›</button></div>`;
}
async function setSt(id,s){await api('admin/status',{id,status:s});loadM()}
async function adjPoin(id){const d=prompt('Tambah/kurangi poin (contoh 100 atau -50):');if(!d)return;const r=await api('admin/poin',{id,delta:d});if(r.error)alertx(r.error);loadM()}
init();
</script>
</body>
</html>
