<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<title>TukarView</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:var(--tg-theme-bg-color,#ffffff);
  --tx:var(--tg-theme-text-color,#14161f);
  --mut:var(--tg-theme-hint-color,#7a7f8e);
  --card:var(--tg-theme-secondary-bg-color,#f3f4f8);
  --line:rgba(128,132,150,.22);
  --pri:#2f5bff;--pri2:#1b3fd1;--ptx:#fff;
  --ink:#0d1636;
  --gold:#f5b73b;--ok:#1f9d63;--bad:#dd4b39;--warn:#d98a0b;
  --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.45;padding-bottom:88px;-webkit-font-smoothing:antialiased}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:18px;letter-spacing:-.3px}
.logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;display:grid;place-items:center}
.chip{display:inline-flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 13px 5px 6px;font-weight:800;font-variant-numeric:tabular-nums}
.coin{width:20px;height:20px;border-radius:50%;background:var(--gold);color:#6b4700;display:grid;place-items:center;font-size:11px;font-weight:900}
main{max-width:640px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
h2{margin:0 0 4px;font-size:20px;letter-spacing:-.3px}
h3{margin:0 0 4px;font-size:16px;letter-spacing:-.2px}
.sub{color:var(--mut);font-size:13px;margin:0 0 14px}
.mut{color:var(--mut);font-size:12.5px}

/* hero balance */
.hero{position:relative;overflow:hidden;border:0;border-radius:20px;padding:20px;color:#fff;background:linear-gradient(140deg,var(--ink) 0%,#1d3a9e 70%,var(--pri) 100%)}
.hero:after{content:"";position:absolute;right:-40px;top:-40px;width:170px;height:170px;border-radius:50%;border:26px solid rgba(255,255,255,.07)}
.hero .lab{font-size:13px;opacity:.75}
.hero .bal{font-size:40px;font-weight:800;letter-spacing:-1.2px;line-height:1.1;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.hero .bal small{font-size:15px;font-weight:600;opacity:.75;letter-spacing:0;margin-left:4px}
.hero .eq{font-size:13px;opacity:.8}
.hero .rule{margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,.18);font-size:13px;opacity:.9}

.btn{display:block;width:100%;border:0;border-radius:12px;padding:14px 16px;font-size:15px;font-weight:700;background:var(--pri);color:var(--ptx);cursor:pointer;font-family:inherit}
.btn:active{opacity:.85}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.sm{display:inline-block;width:auto;padding:9px 15px;font-size:13px;border-radius:10px;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--pri);border:1.5px solid var(--pri)}
.btn.danger{background:transparent;color:var(--bad);border:1.5px solid var(--bad)}
.btn.gold{background:var(--gold);color:#4a3200}
label{display:block;font-size:14px;font-weight:700;margin:0 0 6px}
input{width:100%;padding:13px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--tx);font-size:16px;outline:none;font-family:inherit}
input:focus{border-color:var(--pri)}
.hint{color:var(--mut);font-size:12.5px;margin-top:6px}
.field{margin-bottom:18px}
.pills{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.pill{border:1.5px solid var(--line);background:var(--bg);color:var(--tx);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
.pill:active{border-color:var(--pri);color:var(--pri)}
.inwrap{position:relative}
.inwrap span{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--mut);font-size:13px;pointer-events:none}
.inwrap input{padding-right:64px}

/* summary */
.sum{background:var(--bg);border:1.5px solid var(--line);border-radius:14px;padding:14px;margin:0 0 14px}
.sr{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;padding:3px 0}
.sr b{font-variant-numeric:tabular-nums}
.sr.tot{border-top:1px solid var(--line);margin-top:6px;padding-top:10px}
.sr.tot b{font-size:18px}
.warn{margin-top:8px;color:var(--bad);font-size:13px;font-weight:600}

/* how-to steps */
.how{counter-reset:s;list-style:none;margin:12px 0 0;padding:0}
.how li{counter-increment:s;display:flex;gap:12px;margin-bottom:12px;font-size:14px}
.how li:before{content:counter(s);flex:0 0 24px;height:24px;border-radius:8px;background:var(--pri);color:#fff;font-size:13px;font-weight:800;display:grid;place-items:center;margin-top:1px}
.how b{display:block}
.how span{color:var(--mut);font-size:13px}
.note{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 12px;font-size:13px;color:var(--mut);margin-top:4px}
.note b{color:var(--tx)}

/* video rows */
.vrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.vrow:first-of-type{border-top:0;padding-top:0}
.thw{position:relative;flex:0 0 108px;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:#111}
.th{width:100%;height:100%;object-fit:cover;display:block}
.dur{position:absolute;right:4px;bottom:4px;background:rgba(0,0,0,.78);color:#fff;font-size:11px;font-weight:700;padding:1px 6px;border-radius:5px}
.vi{flex:1;min-width:0}
.vt{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.earn{display:inline-flex;align-items:center;gap:5px;font-weight:800;color:var(--ok);font-size:13px}
.tag{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:700;background:var(--bg);border:1px solid var(--line)}
.tag.ok{color:var(--ok);border-color:var(--ok)}.tag.warn{color:var(--warn);border-color:var(--warn)}.tag.bad{color:var(--bad);border-color:var(--bad)}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin:10px 0}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pri),#6f8cff);border-radius:3px;transition:width .5s}
.row{display:flex;gap:8px;align-items:center}
.row>input{flex:1;min-width:0}
.mv{padding:14px 0;border-top:1px solid var(--line)}
.mv:first-of-type{border-top:0;padding-top:4px}
.empty{text-align:center;padding:22px 8px;color:var(--mut)}
.empty .ic{font-size:34px;margin-bottom:6px}
.stat{display:flex;gap:10px}
.stat>div{flex:1;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
.stat b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.avatar{width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;display:grid;place-items:center;font-size:22px;font-weight:800}
.prof{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.link{word-break:break-all;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:12px;color:var(--mut);margin:12px 0}
.reward{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#fff4d6,#ffe7a8);color:#4a3200;border-radius:14px;padding:12px 14px;margin-bottom:12px}
.reward .coin{width:34px;height:34px;font-size:15px;flex:0 0 34px}
.reward b{font-size:17px;display:block}
.hist{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.hist:first-of-type{border-top:0}

nav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;background:var(--bg);border-top:1px solid var(--line);padding:4px 6px calc(4px + env(safe-area-inset-bottom,0px));gap:4px}
nav button{flex:1;border:0;background:none;color:var(--mut);padding:7px 4px 6px;font-size:11.5px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;border-radius:12px;font-family:inherit}
nav button.on{color:var(--pri);background:color-mix(in srgb,var(--pri) 12%,transparent)}
nav svg{width:23px;height:23px}
.ov{position:fixed;inset:0;z-index:20;background:var(--bg);padding:16px;overflow:auto}
#yt,#yt iframe{width:100%;aspect-ratio:16/9;background:#000;border-radius:14px;display:block}
.big{font-size:56px;font-weight:800;text-align:center;color:var(--pri);margin:8px 0 0;letter-spacing:-1.5px;font-variant-numeric:tabular-nums}
.center{text-align:center}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>
<header>
  <div class="brand"><span class="logo"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></span>TukarView <span class="mut" style="font-weight:600;margin-left:2px">v2</span></div>
  <span class="chip"><span class="coin">P</span><span id="poin">0</span></span>
</header>
<main id="main"><div class="card empty">Loading…</div></main>
<nav id="nav"></nav>
<div id="ov"></div>
<script src="config.js"></script>
<script>
const tg=window.Telegram&&Telegram.WebApp;if(tg){tg.ready();tg.expand()}
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const alertx=m=>tg&&tg.showAlert?tg.showAlert(m):alert(m);
const askx=(m,ok)=>tg&&tg.showConfirm?tg.showConfirm(m,y=>y&&ok()):(confirm(m)&&ok());
let me=null,tab='watch',am={q:'',pg:0};

async function api(path,body){
  const h={'Authorization':'tma '+(tg?tg.initData:'')};
  const o={headers:h};
  if(body){o.method='POST';o.body=JSON.stringify(body);h['content-type']='application/json'}
  try{const r=await fetch(CONFIG.API_URL+path,o);return await r.json()}catch(e){return{error:'Connection problem. Please try again.'}}
}
async function init(){
  if(typeof CONFIG==='undefined'||/GANTI|CHANGE/.test(CONFIG.API_URL)){$('#main').innerHTML='<div class="card">API address is not set. Open config.js and fill in API_URL.</div>';return}
  const r=await api('me');
  if(r.error){$('#main').innerHTML='<div class="card">'+esc(r.error)+'</div>';return}
  me=r;setPoin(r.poin);nav();show('watch');
}
function setPoin(p){me.poin=p;$('#poin').textContent=p}
async function sync(){const m=await api('me');if(!m.error){Object.assign(me,m);setPoin(m.poin)}}
const fmtT=s=>s<60?s+' sec':(Math.floor(s/60)+' min'+(s%60?' '+(s%60)+' sec':''));

const IC=(p)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const ICON={
  watch:IC('<circle cx="12" cy="12" r="9"/><path d="M10 8.5v7l6-3.5z" fill="currentColor"/>'),
  grow:IC('<path d="M4 17l6-6 4 4 6-7"/><path d="M15 8h5v5"/>'),
  profile:IC('<circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/>'),
  admin:IC('<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/>')
};
function nav(){
  const t=[['watch','Watch & Earn'],['grow','Get Views'],['profile','Profile']];if(me.admin)t.push(['admin','Admin']);
  $('#nav').innerHTML=t.map(x=>`<button class="${tab===x[0]?'on':''}" onclick="show('${x[0]}')">${ICON[x[0]]}<span>${x[1]}</span></button>`).join('');
}
function show(t){tab=t;nav();({watch,grow,profile,admin})[t]()}
const out=h=>$('#main').innerHTML=h;
const thumb=(id,d)=>`<div class="thw"><img class="th" src="https://i.ytimg.com/vi/${esc(id)}/mqdefault.jpg" alt="" loading="lazy" onerror="this.style.visibility='hidden'">${d?`<span class="dur">${d}s</span>`:''}</div>`;

/* ---------- Watch & Earn ---------- */
async function watch(){
  out('<div class="card empty">Loading…</div>');
  await sync();
  const r=await api('videos');
  const list=r.videos||[];
  out(`<div class="card hero"><div class="lab">Your balance</div><div class="bal">${me.poin}<small>points</small></div><div class="eq">= ${fmtT(me.poin)} of video you can get watched</div><div class="rule">Watch a video to the end and earn 1 point for every second.</div></div>
  <div class="card"><h3>Videos to watch${list.length?` (${list.length})`:''}</h3><p class="sub">Tap a video, keep it playing until the timer reaches 0, and the points are yours.</p>${list.length?list.map(v=>`<div class="vrow">${thumb(v.yt_id,v.detik)}<div class="vi"><div class="vt">YouTube video</div><div class="mut">Watch ${v.detik} seconds</div></div><button class="btn sm" onclick="watchVideo(${v.id})">+${v.detik}</button></div>`).join(''):`<div class="empty"><div class="ic">🎬</div>No videos to watch right now.<br><br>Invite friends and earn ${me.ref_bonus} points each, or ask a friend to post a video.<br><br><button class="btn ghost sm" onclick="show('profile')">Invite friends</button> <button class="btn ghost sm" onclick="show('grow')">Get views</button></div>`}</div>`);
}

/* ---------- Player + heartbeat ---------- */
let player=null,tm=null,ps=-1;
function loadYT(ok,bad){
  if(window.YT&&YT.Player)return ok();
  window.onYouTubeIframeAPIReady=ok;
  const s=document.createElement('script');s.src='https://www.youtube.com/iframe_api';s.onerror=bad;document.head.appendChild(s);
  setTimeout(()=>{if(!(window.YT&&YT.Player))bad()},8000);
}
async function watchVideo(id){
  const r=await api('start',{video_id:id});
  if(r.error)return alertx(r.error);
  let local=0,c=0,busy=false;ps=-1;
  $('#ov').innerHTML=`<div class="ov"><h2>Watch ${r.detik} seconds</h2><p class="sub">Keep the video playing. Time only counts while it is playing.</p><div id="yt"></div><div class="bar" style="height:8px;margin:14px 0 4px"><i id="pb"></i></div><div class="big" id="cd">${r.detik}</div><div class="mut center" id="st">Loading player…</div><br><button class="btn danger" onclick="closeW()">Cancel</button></div>`;
  loadYT(()=>{
    player=new YT.Player('yt',{videoId:r.yt,playerVars:{autoplay:1,rel:0,playsinline:1},events:{onStateChange:e=>ps=e.data,onReady:e=>{const d=e.target.getDuration();if(d>0&&d<r.detik){setS('This video is shorter than the required watch time.');clearInterval(tm)}}}});
    tm=setInterval(async()=>{
      if(busy)return;
      const vis=document.visibilityState==='visible',pl=ps===1&&vis;
      if(pl)local++;c++;
      setS(pl?'Watching '+local+' / '+r.detik+' sec':(!vis?'App is in the background, counting is paused.':'Press play. Time only counts while the video is playing.'));
      $('#cd').textContent=Math.max(r.detik-local,0);$('#pb').style.width=Math.min(100,local/r.detik*100)+'%';
      if(c%5===0||local>=r.detik){
        busy=true;await api('hb',{sid:r.sid,playing:pl});
        if(local>=r.detik){
          clearInterval(tm);const f=await api('finish',{sid:r.sid});
          closeW();
          if(f.error){alertx(f.error)}else{setPoin(f.poin);alertx('Done! +'+f.got+' points')}
          return watch();
        }
        busy=false;
      }
    },1000);
  },()=>setS('YouTube player failed to load. This view was not counted.'));
}
const setS=t=>{const e=$('#st');if(e)e.textContent=t};
function closeW(){clearInterval(tm);try{player&&player.destroy()}catch(e){}player=null;$('#ov').innerHTML=''}

/* ---------- Get Views (post your video) ---------- */
async function grow(){
  await sync();
  const r=await api('mine');
  const vids=r.videos||[];
  const defD=Math.min(30,Math.max(me.min_dur,me.poin));
  out(`<div class="card"><h2>Get views for your video</h2><p class="sub">Other members watch your YouTube video and you pay them with points.</p>
  <ol class="how">
    <li><div><b>Paste your YouTube link</b><span>Any normal YouTube or Shorts link works.</span></div></li>
    <li><div><b>Choose how many seconds each person watches</b><span>Each viewer earns exactly this many points. 1 second = 1 point.</span></div></li>
    <li><div><b>Choose how many points to spend</b><span>Your video stays live until these points are used up. You can add more or stop at any time.</span></div></li>
  </ol></div>

  <div class="card"><h3 style="margin-bottom:14px">New video</h3>
  <div class="field"><label>YouTube link</label><input id="b_url" inputmode="url" placeholder="https://youtu.be/..."></div>
  <div class="field"><label>Watch time per viewer</label><div class="inwrap"><input id="b_d" type="number" min="${me.min_dur}" max="${me.max_dur}" inputmode="numeric" value="${defD}" oninput="hit()"><span>seconds</span></div>
    <div class="pills">${[15,30,60,120].map(x=>`<button class="pill" onclick="setD(${x})">${x}s</button>`).join('')}</div>
    <div class="hint">Between ${me.min_dur} and ${me.max_dur} seconds. Short time = more viewers for the same points.</div></div>
  <div class="field"><label>Points to spend</label><div class="inwrap"><input id="b_m" type="number" min="1" inputmode="numeric" value="${me.poin}" oninput="hit()"><span>points</span></div>
    <div class="pills"><button class="pill" onclick="setM(1)">All (${me.poin})</button><button class="pill" onclick="setM(.5)">Half</button></div>
    <div class="hint">You have ${me.poin} points. You cannot spend more than that.</div></div>
  <div class="sum" id="b_e"></div>
  <button class="btn" id="b_go" onclick="doPost()">Start getting views</button>
  <div class="note" style="margin-top:12px"><b>Good to know:</b> members can watch your video again and again, as long as it stays posted and has points. Watch-first rule: within 24 hours you can spend on your videos only as many points as you earned by watching.</div></div>

  <div class="card"><h3>Your active videos${vids.length?` (${vids.length})`:''}</h3>${vids.length?`<p class="sub">Pressing Stop returns the unused points and removes the video.</p>`:''}${vids.length?vids.map(v=>{
    const left=Math.floor(v.sisa/v.detik),pct=Math.max(0,Math.min(100,Math.round((v.target-v.sisa)/v.target*100))),off=v.sisa<v.detik;
    return `<div class="mv"><div class="row" style="align-items:flex-start;gap:12px">${thumb(v.yt_id,v.detik)}<div class="vi"><div class="vt">YouTube video</div><div class="mut">${v.dilihat} views received<br>${v.detik}s per viewer · ${v.sisa} points left</div><div style="margin-top:6px">${off?'<span class="tag warn">Out of points</span>':`<span class="tag ok">Live · ${left} more view${left==1?'':'s'}</span>`}</div></div></div><div class="bar"><i style="width:${pct}%"></i></div><div class="row"><input id="tp_${v.id}" type="number" min="1" inputmode="numeric" placeholder="Points to add"><button class="btn sm" onclick="topup(${v.id})">Add points</button><button class="btn sm danger" onclick="cancel(${v.id})">Stop</button></div></div>`}).join(''):`<div class="empty"><div class="ic">📹</div>No active videos. Post your first video above.</div>`}</div>`);
  hit();
}
function setD(x){$('#b_d').value=x;hit()}
function setM(f){$('#b_m').value=Math.floor(me.poin*f);hit()}
function hit(){
  const d=parseInt($('#b_d').value)||0,m=parseInt($('#b_m').value)||0;
  let err='';
  if(d<me.min_dur||d>me.max_dur)err=`Watch time must be between ${me.min_dur} and ${me.max_dur} seconds.`;
  else if(d>me.poin)err=`Watch time cannot be more than your points (${me.poin}).`;
  else if(m<d)err=`Spend at least ${d} points (one viewer).`;
  else if(m>me.poin)err=`Not enough points. You have ${me.poin}.`;
  const v=d>0?Math.floor(m/d):0;
  $('#b_e').innerHTML=`<div class="sr"><span>Each viewer watches</span><b>${d} sec</b></div><div class="sr"><span>Each viewer earns</span><b>${d} points</b></div><div class="sr"><span>Points left after posting</span><b>${Math.max(0,me.poin-m)}</b></div><div class="sr tot"><span>Expected views</span><b>about ${v}</b></div>`+(err?`<div class="warn">${err}</div>`:'');
  $('#b_go').disabled=!!err;
}
async function doPost(){
  const r=await api('boost',{url:$('#b_url').value,dur:$('#b_d').value,budget:$('#b_m').value});
  if(r.error)return alertx(r.error);
  setPoin(r.poin);alertx('Your video is live! Members can watch it now.');grow();
}
function cancel(id){
  askx('Stop this video? Unused points are returned and the video is removed.',async()=>{
    const r=await api('cancel',{video_id:id});
    if(r.error)return alertx(r.error);
    alertx('Video removed. '+r.refund+' points returned.');grow();
  });
}
async function topup(id){
  const r=await api('topup',{video_id:id,points:$('#tp_'+id).value});
  if(r.error)return alertx(r.error);
  alertx('Points added.');grow();
}

/* ---------- Profile ---------- */
const refLink=()=>`https://t.me/${me.bot}?startapp=ref_${me.tg_id}`;
async function copyLink(){
  const l=refLink();
  try{await navigator.clipboard.writeText(l)}catch(e){const t=document.createElement('textarea');t.value=l;document.body.appendChild(t);t.select();try{document.execCommand('copy')}catch(_){}t.remove()}
  alertx('Link copied.');
}
function shareLink(){
  const u='https://t.me/share/url?url='+encodeURIComponent(refLink())+'&text='+encodeURIComponent('Watch videos, earn points and grow your YouTube views on TukarView!');
  tg&&tg.openTelegramLink?tg.openTelegramLink(u):window.open(u);
}
async function profile(){
  await sync();
  const r=await api('ledger');
  const led=r.ledger||[];
  out(`<div class="card"><div class="prof"><div class="avatar">${esc((me.name||'?').trim().charAt(0).toUpperCase()||'?')}</div><div><h2 style="margin:0">${esc(me.name)}</h2><div class="mut">Telegram ID ${me.tg_id}</div></div></div>
  <div class="stat"><div><b>${me.poin}</b><span class="mut">Points</span></div><div><b>${me.refs}</b><span class="mut">Friends invited</span></div></div></div>
  <div class="card"><div class="reward"><span class="coin">P</span><div><b>${me.ref_bonus} points per friend</b>Paid when your friend finishes their first video.</div></div>
  <h3>Invite friends</h3><p class="sub" style="margin:0">Share your personal link. Every friend who joins with it and watches one video to the end earns you ${me.ref_bonus} points.</p><div class="link">${esc(refLink())}</div><div class="row"><button class="btn" onclick="copyLink()">Copy link</button><button class="btn ghost" onclick="shareLink()">Share</button></div></div>
  <div class="card"><h3>Points history</h3>${led.length?led.map(l=>`<div class="hist"><div><div>${esc(l.reason)}</div><div class="mut">${new Date(l.t*1000).toLocaleDateString('en-US',{month:'short',day:'numeric'})}</div></div><b style="color:${l.delta>0?'var(--ok)':'var(--bad)'}">${l.delta>0?'+':''}${l.delta}</b></div>`).join(''):'<div class="empty">No activity yet.</div>'}</div>`);
}

/* ---------- Admin: members ---------- */
async function admin(){
  out(`<div class="card"><h2>Members</h2><div id="ast" class="sub"></div><input id="aq" placeholder="Search name / username / Telegram ID" value="${esc(am.q)}" oninput="am.q=this.value;am.pg=0;clearTimeout(window.__t);window.__t=setTimeout(loadM,300)"></div><div class="card" id="alist">Loading…</div>`);
  loadM();
}
async function loadM(){
  const r=await api('admin/members?q='+encodeURIComponent(am.q)+'&page='+am.pg);
  if(r.error){$('#alist').textContent=r.error;return}
  const s=r.stats||{};
  $('#ast').textContent=`Total ${s.total||0} · Blocked ${s.blokir||0} · New in 24h ${s.hari||0}`;
  $('#alist').innerHTML=(r.members.map(m=>{const on=m.status==='aktif';return `<div class="vrow"><div class="vi"><div class="vt">${esc(m.name)} ${m.username?'<span class="mut">@'+esc(m.username)+'</span>':''}</div><div class="mut">ID ${m.tg_id} · ${m.poin} pts · ${m.views} views · ${new Date(m.created_at*1000).toLocaleDateString('en-US')} <span class="tag ${on?'ok':'bad'}">${on?'Active':'Blocked'}</span></div></div><div style="display:flex;flex-direction:column;gap:6px"><button class="btn sm" onclick="adjPoin(${m.id})">Points</button><button class="btn sm ${on?'danger':'ghost'}" onclick="setSt(${m.id},'${on?'blokir':'aktif'}')">${on?'Block':'Unblock'}</button></div></div>`}).join('')||'<div class="empty">No members found.</div>')
  +`<div class="row" style="margin-top:12px;justify-content:center"><button class="btn sm ghost" ${am.pg<=0?'disabled':''} onclick="am.pg--;loadM()">‹ Prev</button><button class="btn sm ghost" ${r.members.length<15?'disabled':''} onclick="am.pg++;loadM()">Next ›</button></div>`;
}
async function setSt(id,s){await api('admin/status',{id,status:s});loadM()}
async function adjPoin(id){const d=prompt('Add or subtract points (e.g. 100 or -50):');if(!d)return;const r=await api('admin/poin',{id,delta:d});if(r.error)alertx(r.error);loadM()}
init();
</script>
