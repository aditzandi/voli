<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>TukarView</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:var(--tg-theme-bg-color,#ffffff);
  --tx:var(--tg-theme-text-color,#1c1c1e);
  --mut:var(--tg-theme-hint-color,#8e8e93);
  --pri:var(--tg-theme-button-color,#6c5ce7);
  --ptx:var(--tg-theme-button-text-color,#ffffff);
  --card:var(--tg-theme-secondary-bg-color,#f2f2f7);
  --line:rgba(128,128,128,.2);
  --bad:#e5533d;--ok:#2fa56b;--warn:#e8a317;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.4;padding-bottom:84px}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:17px;letter-spacing:-.2px}
.logo{width:28px;height:28px;border-radius:8px;background:var(--pri);color:var(--ptx);display:grid;place-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 12px 5px 8px;font-weight:700}
.coin{width:18px;height:18px;border-radius:50%;background:#f5b73b;color:#7a5200;display:grid;place-items:center;font-size:11px;font-weight:800}
main{max-width:640px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.hero{border:0;color:var(--ptx);background:var(--pri);background:linear-gradient(135deg,var(--pri),color-mix(in srgb,var(--pri) 55%,#000))}
.hero h2,.hero .sub{color:var(--ptx)}
.hero .sub{opacity:.85}
h2{margin:0 0 4px;font-size:19px;letter-spacing:-.2px}
h3{margin:0 0 12px;font-size:16px}
.sub{color:var(--mut);font-size:13px;margin:0 0 12px}
.mut{color:var(--mut);font-size:12px}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:13px 16px;font-size:15px;font-weight:700;background:var(--pri);color:var(--ptx);cursor:pointer}
.btn:active{opacity:.85}
.btn:disabled{opacity:.45}
.btn.sm{display:inline-block;width:auto;padding:8px 14px;font-size:13px;border-radius:10px;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--pri);border:1.5px solid var(--pri)}
.btn.danger{background:transparent;color:var(--bad);border:1.5px solid var(--bad)}
.btn.light{background:rgba(255,255,255,.2);color:var(--ptx)}
label{display:block;font-size:13px;font-weight:600;margin:0 0 6px}
input,select{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--tx);font-size:15px;outline:none}
input:focus,select:focus{border-color:var(--pri)}
.step{display:flex;gap:12px;margin-bottom:16px}
.step .n{flex:0 0 26px;height:26px;border-radius:50%;background:var(--pri);color:var(--ptx);font-size:13px;font-weight:800;display:grid;place-items:center;margin-top:1px}
.step .f{flex:1;min-width:0}
.sum{background:var(--bg);border:1px dashed var(--line);border-radius:12px;padding:12px;margin:2px 0 14px}
.sr{display:flex;justify-content:space-between;font-size:14px}
.sr+.sr{margin-top:4px}
.warn{margin-top:8px;color:var(--bad);font-size:13px;font-weight:600}
details summary{cursor:pointer;font-weight:700;font-size:16px;list-style:none}
details summary::-webkit-details-marker{display:none}
details ul{margin:10px 0 0;padding-left:18px;color:var(--mut);font-size:13px}
details li{margin-bottom:6px}
.vrow{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.vrow:first-of-type{border-top:0;padding-top:0}
.thw{position:relative;flex:0 0 96px;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:#000}
.th{width:100%;height:100%;object-fit:cover;display:block}
.dur{position:absolute;right:4px;bottom:4px;background:rgba(0,0,0,.75);color:#fff;font-size:11px;font-weight:700;padding:1px 5px;border-radius:5px}
.vi{flex:1;min-width:0}
.vt{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700;background:var(--bg);border:1px solid var(--line)}
.tag.ok{color:var(--ok);border-color:var(--ok)}.tag.warn{color:var(--warn);border-color:var(--warn)}.tag.bad{color:var(--bad);border-color:var(--bad)}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;width:0;background:var(--pri);border-radius:3px;transition:width .5s}
.row{display:flex;gap:8px;align-items:center}
.row>input{flex:1}
.empty{text-align:center;padding:18px 8px;color:var(--mut)}
.empty .ic{font-size:34px;margin-bottom:6px}
.stat{display:flex;gap:10px}
.stat>div{flex:1;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
.stat b{display:block;font-size:20px}
.avatar{width:54px;height:54px;border-radius:50%;background:var(--pri);color:var(--ptx);display:grid;place-items:center;font-size:22px;font-weight:800}
.prof{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.link{word-break:break-all;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:12px;color:var(--mut);margin:10px 0}
.hist{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.hist:first-of-type{border-top:0}
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;background:none;color:var(--mut);padding:9px 4px 8px;font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
nav button.on{color:var(--pri)}
nav svg{width:23px;height:23px}
.ov{position:fixed;inset:0;z-index:20;background:var(--bg);padding:16px;overflow:auto}
#yt,#yt iframe{width:100%;aspect-ratio:16/9;background:#000;border-radius:14px;display:block}
.big{font-size:54px;font-weight:800;text-align:center;color:var(--pri);margin:8px 0 0;letter-spacing:-1px}
.center{text-align:center}
</style>
</head>
<body>
<header>
  <div class="brand"><span class="logo"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></span>TukarView</div>
  <span class="chip"><span class="coin">P</span><span id="poin">0</span></span>
</header>
<main id="main"><div class="card empty">Loading…</div></main>
<nav id="nav"></nav>
<div id="ov"></div>
<script src="config.js"></script>
<script>
const tg=window.Telegram&&Telegram.WebApp;if(tg){tg.ready();tg.expand()}
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const alertx=m=>tg&&tg.showAlert?tg.showAlert(m):alert(m);
const REF_BONUS=600;
let me=null,tab='tonton',am={q:'',pg:0};

async function api(path,body){
  const h={'Authorization':'tma '+(tg?tg.initData:'')};
  const o={headers:h};
  if(body){o.method='POST';o.body=JSON.stringify(body);h['content-type']='application/json'}
  try{const r=await fetch(CONFIG.API_URL+path,o);return await r.json()}catch(e){return{error:'Connection problem. Please try again.'}}
}
async function init(){
  if(typeof CONFIG==='undefined'||/GANTI/.test(CONFIG.API_URL)){$('#main').innerHTML='<div class="card">API address is not set. Open config.js and fill in API_URL.</div>';return}
  const r=await api('me');
  if(r.error){$('#main').innerHTML='<div class="card">'+esc(r.error)+'</div>';return}
  me=r;setPoin(r.poin);nav();show('tonton');
}
function setPoin(p){me.poin=p;$('#poin').textContent=p}
async function sync(){const m=await api('me');if(!m.error){me.refs=m.refs;setPoin(m.poin)}}

const ICON={
  tonton:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M10 8.5v7l6-3.5z" fill="currentColor"/></svg>',
  boost:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="M12 8v8M8 12h8"/></svg>',
  saya:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>',
  admin:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/></svg>'
};
function nav(){
  const t=[['tonton','Watch'],['boost','Post'],['saya','Profile']];if(me.admin)t.push(['admin','Admin']);
  $('#nav').innerHTML=t.map(x=>`<button class="${tab===x[0]?'on':''}" onclick="show('${x[0]}')">${ICON[x[0]]}<span>${x[1]}</span></button>`).join('');
}
function show(t){tab=t;nav();({tonton,boost,saya,admin})[t]()}
const out=h=>$('#main').innerHTML=h;
const thumb=(id,d)=>`<div class="thw"><img class="th" src="https://i.ytimg.com/vi/${esc(id)}/mqdefault.jpg" alt="" loading="lazy" onerror="this.style.visibility='hidden'">${d?`<span class="dur">${d}s</span>`:''}</div>`;

/* ---------- Watch ---------- */
async function tonton(){
  out('<div class="card empty">Loading…</div>');
  await sync();
  const r=await api('videos');
  const list=r.videos||[];
  out(`<div class="card hero"><h2>Watch &amp; earn</h2><p class="sub" style="margin:0 0 12px">Watch other members' videos to the end. 1 second = 1 point.</p><div style="font-size:30px;font-weight:800">${me.poin} <span style="font-size:14px;font-weight:600;opacity:.85">points</span></div></div>
  <div class="card"><h3>Available videos${list.length?` (${list.length})`:''}</h3>${list.length?list.map(v=>`<div class="vrow">${thumb(v.yt_id,v.detik)}<div class="vi"><div class="vt">Video ${esc(v.yt_id.slice(0,4))}…</div><div class="mut">Watch ${v.detik} seconds</div></div><button class="btn sm" onclick="watch(${v.id})">+${v.detik} pts</button></div>`).join(''):`<div class="empty"><div class="ic">🎬</div>No videos to watch right now.<br>Check back soon, or post your own video.<br><br><button class="btn ghost sm" onclick="show('boost')">Post a video</button></div>`}</div>`);
}

/* ---------- Player + heartbeat ---------- */
let player=null,tm=null,ps=-1;
function loadYT(ok,bad){
  if(window.YT&&YT.Player)return ok();
  window.onYouTubeIframeAPIReady=ok;
  const s=document.createElement('script');s.src='https://www.youtube.com/iframe_api';s.onerror=bad;document.head.appendChild(s);
  setTimeout(()=>{if(!(window.YT&&YT.Player))bad()},8000);
}
async function watch(id){
  const r=await api('start',{video_id:id});
  if(r.error)return alertx(r.error);
  let local=0,c=0,busy=false;ps=-1;
  $('#ov').innerHTML=`<div class="ov"><h2>Watch ${r.detik} seconds</h2><p class="sub">Keep the video playing. Time only counts while it is playing.</p><div id="yt"></div><div class="bar" style="height:8px;margin:14px 0 4px"><i id="pb"></i></div><div class="big" id="cd">${r.detik}</div><div class="mut center" id="st">Loading player…</div><br><button class="btn danger" onclick="closeW()">Cancel</button></div>`;
  loadYT(()=>{
    player=new YT.Player('yt',{videoId:r.yt,playerVars:{autoplay:1,rel:0,playsinline:1},events:{onStateChange:e=>ps=e.data,onReady:e=>{const d=e.target.getDuration();if(d>0&&d<r.detik){setS('This video is shorter than the required watch time.');clearInterval(tm)}}}});
    tm=setInterval(async()=>{
      if(busy)return;
      const vis=document.visibilityState==='visible',pl=ps===1&&vis;
      if(pl)local++;c++;
      setS(pl?'Watching '+local+' / '+r.detik+' sec':(!vis?'App is in the background, counting is paused.':'Press play. Time only counts while the video is playing.'));
      $('#cd').textContent=Math.max(r.detik-local,0);$('#pb').style.width=Math.min(100,local/r.detik*100)+'%';
      if(c%5===0||local>=r.detik){
        busy=true;await api('hb',{sid:r.sid,playing:pl});
        if(local>=r.detik){
          clearInterval(tm);const f=await api('finish',{sid:r.sid});
          closeW();
          if(f.error){alertx(f.error)}else{setPoin(f.poin);alertx('Done! +'+f.got+' points')}
          return tonton();
        }
        busy=false;
      }
    },1000);
  },()=>setS('YouTube player failed to load. This view was not counted.'));
}
const setS=t=>{const e=$('#st');if(e)e.textContent=t};
function closeW(){clearInterval(tm);try{player&&player.destroy()}catch(e){}player=null;$('#ov').innerHTML=''}

/* ---------- Post video ---------- */
function hit(){
  const d=+$('#b_d').value,n=parseInt($('#b_m').value)||0,c=d*n;
  $('#b_e').innerHTML=`<div class="sr"><span>Total cost</span><b>${c} points</b></div><div class="sr mut"><span>${n} viewers × ${d} seconds</span><span>Your balance: ${me.poin}</span></div>`+(c>me.poin?`<div class="warn">Not enough points. You have ${me.poin}.</div>`:'');
}
async function doBoost(){
  const r=await api('boost',{url:$('#b_url').value,detik:$('#b_d').value,views:$('#b_m').value});
  if(r.error)return alertx(r.error);
  setPoin(r.poin);alertx('Video posted!');boost();
}
async function cancel(id){
  const r=await api('cancel',{video_id:id});
  if(r.error)return alertx(r.error);
  alertx('Video stopped and removed. '+r.refund+' points refunded.');boost();
}
async function topup(id){
  const r=await api('topup',{video_id:id,views:$('#tp_'+id).value});
  if(r.error)return alertx(r.error);
  alertx('Viewers added.');boost();
}
window.boost=boost;

/* ---------- Profile ---------- */
const refLink=()=>`https://t.me/${me.bot}?startapp=ref_${me.tg_id}`;
async function copyLink(){
  const l=refLink();
  try{await navigator.clipboard.writeText(l)}catch(e){const t=document.createElement('textarea');t.value=l;document.body.appendChild(t);t.select();try{document.execCommand('copy')}catch(_){}t.remove()}
  alertx('Link copied.');
}
function shareLink(){
  const u='https://t.me/share/url?url='+encodeURIComponent(refLink())+'&text='+encodeURIComponent('Watch videos, earn points and grow your YouTube views on TukarView!');
  tg&&tg.openTelegramLink?tg.openTelegramLink(u):window.open(u);
}
async function saya(){
  await sync();
  const r=await api('mine');
  const led=r.ledger||[];
  out(`<div class="card"><div class="prof"><div class="avatar">${esc((me.name||'?').trim().charAt(0).toUpperCase()||'?')}</div><div><h2 style="margin:0">${esc(me.name)}</h2><div class="mut">Telegram ID ${me.tg_id}</div></div></div>
  <div class="stat"><div><b>${me.poin}</b><span class="mut">Points</span></div><div><b>${me.refs}</b><span class="mut">Friends invited</span></div></div></div>
  <div class="card"><h3>Invite friends, earn ${REF_BONUS} points each</h3><p class="sub" style="margin:0">You get ${REF_BONUS} points when a friend you invited watches their first video to the end.</p><div class="link">${esc(refLink())}</div><div class="row"><button class="btn" onclick="copyLink()">Copy link</button><button class="btn ghost" onclick="shareLink()">Share</button></div></div>
  <div class="card"><h3>Points history</h3>${led.length?led.map(l=>`<div class="hist"><div><div>${esc(l.reason)}</div><div class="mut">${new Date(l.t*1000).toLocaleDateString('en-US',{month:'short',day:'numeric'})}</div></div><b style="color:${l.delta>0?'var(--ok)':'var(--bad)'}">${l.delta>0?'+':''}${l.delta}</b></div>`).join(''):'<div class="empty">No activity yet.</div>'}</div>`);
}

/* ---------- Admin: members ---------- */
async function admin(){
  out(`<div class="card"><h2>Members</h2><div id="ast" class="sub"></div><input id="aq" placeholder="Search name / username / Telegram ID" value="${esc(am.q)}" oninput="am.q=this.value;am.pg=0;clearTimeout(window.__t);window.__t=setTimeout(loadM,300)"></div><div class="card" id="alist">Loading…</div>`);
  loadM();
}
async function loadM(){
  const r=await api('admin/members?q='+encodeURIComponent(am.q)+'&page='+am.pg);
  if(r.error){$('#alist').textContent=r.error;return}
  const s=r.stats||{};
  $('#ast').textContent=`Total ${s.total||0} · Blocked ${s.blokir||0} · New in 24h ${s.hari||0}`;
  $('#alist').innerHTML=(r.members.map(m=>{const on=m.status==='aktif';return `<div class="vrow"><div class="vi"><div class="vt">${esc(m.name)} ${m.username?'<span class="mut">@'+esc(m.username)+'</span>':''}</div><div class="mut">ID ${m.tg_id} · ${m.poin} pts · ${m.views} views · ${new Date(m.created_at*1000).toLocaleDateString('en-US')} <span class="tag ${on?'ok':'bad'}">${on?'Active':'Blocked'}</span></div></div><div style="display:flex;flex-direction:column;gap:6px"><button class="btn sm" onclick="adjPoin(${m.id})">Points</button><button class="btn sm ${on?'danger':'ghost'}" onclick="setSt(${m.id},'${on?'blokir':'aktif'}')">${on?'Block':'Unblock'}</button></div></div>`}).join('')||'<div class="empty">No members found.</div>')
  +`<div class="row" style="margin-top:12px;justify-content:center"><button class="btn sm ghost" ${am.pg<=0?'disabled':''} onclick="am.pg--;loadM()">‹ Prev</button><button class="btn sm ghost" ${r.members.length<15?'disabled':''} onclick="am.pg++;loadM()">Next ›</button></div>`;
}
async function setSt(id,s){await api('admin/status',{id,status:s});loadM()}
async function adjPoin(id){const d=prompt('Add or subtract points (e.g. 100 or -50):');if(!d)return;const r=await api('admin/poin',{id,delta:d});if(r.error)alertx(r.error);loadM()}
init();
</script>
</body>
</html>
